appId: com.kard.tcgsimulator
productName: Kard - TCG Simulator
executableName: Kard
copyright: Copyright © 2026 Kard
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
npmRebuild: false
# Atualização automática: o app procura versões novas nas Releases deste repositório do GitHub.
# Troque owner/repo pelos seus (veja PUBLICAR.md).
publish:
  provider: github
  owner: fernandoalmeida04
  repo: kard-tcg
  releaseType: draft
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kard - TCG Simulator
  uninstallDisplayName: Kard - TCG Simulator
  artifactName: Kard-TCG-Simulator-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
